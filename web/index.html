<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PolyResolve</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 0 auto; max-width: 60rem; padding: 1rem; }
      ol { list-style: none; margin: 1rem 0; padding: 0; }
      li { border-bottom: 1px solid #ddd; display: grid; gap: 0 1rem; grid-template-columns: 11rem 8rem 1fr; padding: 0.5rem 0; }
      .conversation { color: #666; grid-column: 2 / 4; grid-row: 2; }
      .text { grid-column: 2 / 4; grid-row: 3; white-space: pre-wrap; word-break: break-word; }
      .time { color: #666; }
      .sender { font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
