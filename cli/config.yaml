addr: "127.0.0.1:15801"
log_level: debug
sandbox_exit_code: 8
serve_exit_code: 1
shutdown_timeout_exit_code: 5
shutdown_timeout_ms: 10000
web_dir: web/dist
messages:
  default: 50
  max: 200
errors:
  bad_request:
    code: bad_request
  conflict:
    code: conflict
  not_found:
    code: not_found
  storage:
    code: storage
  unknown_action:
    code: unknown_action
  unprocessable:
    code: unprocessable
triage:
  codex:
    args:
      - exec
      - --json
      - --skip-git-repo-check
      - --ignore-rules
      - --ignore-user-config
      - -m
      - gpt-6-luna
      - -s
      - read-only
      - -c
      - web_search="disabled"
      - --disable
      - shell_tool
      - --disable
      - unified_exec
      - --disable
      - apps
      - --disable
      - plugins
      - --disable
      - browser_use
      - --disable
      - browser_use_external
      - --disable
      - computer_use
      - --disable
      - multi_agent
      - --disable
      - hooks
      - --disable
      - image_generation
      - --disable
      - in_app_browser
      - --disable
      - view_image
      - --disable
      - skill_search
      - --color
      - never
      - -c
      - model_provider="triage"
      - -c
      - model_providers.triage={name="triage",base_url="${CODEX_BASE_URL}",env_key="CODEX_API_KEY",wire_api="responses"}
      - -C
      - .debug/codex-work
    bin: codex
    endpoint:
      proxy: "${CODEX_PROXY}"
      timeout_ms: 10000
      url: "${CODEX_BASE_URL}"
    env:
      CODEX_HOME: .debug/codex-home
    sandbox:
      bin: /usr/bin/sandbox-exec
      canary: /usr/bin/true
      paths:
        BREW: /opt/homebrew
        CODEXHOME: .debug/codex-home
        PROJ: .
        WORK: .debug/codex-work
      probe: [--help]
      profile: cli/sandbox/codex.sb
      vars:
        HOME: "${HOME}"
        PROXY: "${CODEX_PROXY}"
    timeout_ms: 300000
    vars:
      CODEX_API_KEY: "${CODEX_API_KEY}"
      CODEX_BASE_URL: "${CODEX_BASE_URL}"
      HTTPS_PROXY: "${CODEX_PROXY}"
      PATH: "${PATH}"
      https_proxy: "${CODEX_PROXY}"
  decide:
    key: "${DECISIONS_API_KEY}"
    proxy: "${DECISIONS_PROXY}"
    timeout_ms: 35000
    url: "${DECISIONS_URL}"
  limits:
    batch: 100
    intake: 200
    lookback_ms: 3600000
    max_attempts: 3
    max_revivals: 2
    parallel: 4
    poll_ms: 5000
    retry_after_ms: 60000
    retry_max_ms: 900000
  mode: enabled
  model: gpt-6-luna
  notice:
    late: "（消息实际发生于 {time}）"
    late_after_ms: 1800000
    states:
      cancelled: 已取消
      open: 进行中
      resolved: 已解决
    template: |-
      【{state}】{label}｜优先级 {score}（紧急度 {urgency}，{people} 人、{conversations} 个会话、{sources} 个来源）{late}
      变化：{changes}
      {analysis}
  notify:
    args:
      - chat
      - +messages-send
      - --as
      - user
      - --markdown
      - "-"
      - --body-stdin
      - --yes
      - --open-dingtalk-id
    bin: dws
    env:
      DO_NOT_TRACK: "1"
    sandbox: &dws_sandbox
      bin: /usr/bin/sandbox-exec
      canary: /usr/bin/true
      paths: {}
      probe: [--help]
      profile: cli/sandbox/dws.sb
      vars:
        HOME: "${HOME}"
    timeout_ms: 30000
    vars:
      HOME: "${HOME}"
      PATH: "${PATH}"
  notify_target: "${NOTIFY_TARGET}"
  prompts_dir: cli/prompts
  questions:
    threshold: 0.8
    topic:
      min_confidence: 0.6
      name: topic
      new_label: 新话题
      none_label: 不属于任何话题
    urgent:
      name: urgent
  redact:
    digest_min_chars: 40
    hash_chars: 8
    hash_key: "${TRIAGE_HASH_KEY}"
    patterns:
      - pattern: '[\x{200B}-\x{200D}\x{2060}\x{FEFF}]'
        placeholder: ""
      - pattern: '(?s)-----BEGIN [A-Z ]*(?:PRIVATE KEY|CERTIFICATE)[A-Z ]*-----.*?-----END [A-Z ]*(?:PRIVATE KEY|CERTIFICATE)[A-Z ]*-----'
        placeholder: "[机密#{hash}]"
      - pattern: '(?s)-----BEGIN [A-Z ]*(?:PRIVATE KEY|CERTIFICATE)[A-Z ]*-----.*'
        placeholder: "[机密#{hash}]"
      - pattern: '(?i)[a-z][a-z0-9+.-]{1,15}://[a-z0-9._~:/?#@!$&*+,;=%\[\]()''-]+'
        placeholder: "[链接#{hash}]"
      - pattern: '(?i)git@[a-z0-9.-]+:[a-z0-9._/~-]+'
        placeholder: "[链接#{hash}]"
      - pattern: '(?i)www\.[a-z0-9._~:/?#@!$&*+,;=%\[\]()''-]+'
        placeholder: "[链接#{hash}]"
      - pattern: '(?i)[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:dingtalk|alidocs|aliyun|alipan|aliyundrive)\.com(?:[/?#][a-z0-9._~:/?#@!$&*+,;=%\[\]()''-]*)?'
        placeholder: "[链接#{hash}]"
      - pattern: '(?i)[a-z0-9-]+(?:\.[a-z0-9-]+)+/[a-z0-9._~:/?#@!$&*+,;=%\[\]()''-]*'
        placeholder: "[链接#{hash}]"
      - pattern: '(?:sk-[A-Za-z0-9_-]{16,}|(?:AKIA|ASIA)[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[0-9A-Za-z]{30,}|github_pat_[0-9A-Za-z_]{20,}|glpat-[0-9A-Za-z_-]{20,}|xox[abprs]-[0-9A-Za-z-]{10,}|eyJ[0-9A-Za-z_-]{5,}\.[0-9A-Za-z_-]{5,}\.[0-9A-Za-z_-]{5,}|LTAI[0-9A-Za-z]{12,}|AKID[0-9A-Za-z]{16,})'
        placeholder: "[机密#{hash}]"
      - pattern: '(?i)(?:authorization|cookie|set-cookie)[ \t]*[:：][^\n]*'
        placeholder: "[凭据#{hash}]"
      - pattern: '(?i)bearer[ \t]+[A-Za-z0-9._~+/=-]{8,}'
        placeholder: "[凭据#{hash}]"
      - pattern: '(?i)((?:password|passwd|pwd|passphrase|secret|token|api[_ -]?key|access[_ -]?key|private[_ -]?key|credential|密码|口令|密钥|秘钥|令牌|验证码|授权码|助记词|私钥)[ \t]*(?:[:：=]|是|为|改成|改为)?[ \t]*)([^\s,，;；。]{1,128})'
        placeholder: "${1}[已隐藏#{hash}]"
        group: 2
      - pattern: '(?i)([A-Za-z0-9_.-]*(?:key|secret|token|password|passwd|pwd)[A-Za-z0-9_.-]*[ \t]*[=:][ \t]*)([^\s,，;；]{1,128})'
        placeholder: "${1}[已隐藏#{hash}]"
        group: 2
      - pattern: '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'
        placeholder: "[邮箱#{hash}]"
      - pattern: '(?:\+?86[ -]?)?1[3-9][0-9][ -]?[0-9]{4}[ -]?[0-9]{4}'
        placeholder: "[数字#{hash}]"
      - pattern: '[0-9]{4}(?:[ -][0-9]{4}){3,4}'
        placeholder: "[数字#{hash}]"
      - pattern: '[0-9]{11,}'
        placeholder: "[数字#{hash}]"
      - pattern: '[0-9]{1,3}(?:\.[0-9]{1,3}){3}(?::[0-9]{1,5})?'
        placeholder: "[地址#{hash}]"
      - pattern: '(?i)(?:[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:internal|local|lan|corp|intra|intranet|localdomain)|localhost)(?::[0-9]{1,5})?'
        placeholder: "[地址#{hash}]"
      - pattern: '(?:~|\.\.?)?/(?:Users|home|root|etc|var|opt|private|srv|mnt|tmp)/[^\s"''<>,，;；]*'
        placeholder: "[路径#{hash}]"
      - pattern: '[A-Za-z]:\\[^\s"''<>,，;；]*'
        placeholder: "[路径#{hash}]"
      - pattern: '~/\.[A-Za-z0-9_./-]+'
        placeholder: "[路径#{hash}]"
      - pattern: '(?i)[A-Za-z0-9_.-]*\.(?:pem|key|p12|pfx|env|kdbx|jks|keystore|crt|cer|ppk|gpg)'
        placeholder: "[文件#{hash}]"
      - pattern: '(?i)id_(?:rsa|dsa|ecdsa|ed25519)(?:\.pub)?'
        placeholder: "[文件#{hash}]"
      - pattern: '[A-Za-z0-9+/_=-]{24,}'
        placeholder: "[长串#{hash}]"
    unknown_sender: 未知发送人
  session:
    fresh: ["-"]
    omitted: "此处有 {count} 条消息未提供，原因：{reason}"
    resume: [resume, "{thread}", "-"]
  sizes:
    context_max_chars: 12000
    label_chars: 40
    result_max_chars: 3000
    session_gap_ms: 7200000
  topics:
    archive_after_ms: 1209600000
    clues:
      patterns:
        - kind: link
          pattern: '(?i)https?://[a-z0-9._~:/?#@!$&*+,;=%\[\]()''-]{12,}'
        - kind: file
          pattern: '(?i)[^\s/\\:*?"<>|]{4,}\.(?:docx?|xlsx?|pptx?|pdf|csv|zip|rar|7z|sql|log)'
      subject:
        ignore: [通知, 提醒, 会议邀请, 自动回复, 日报, 周报]
        min_chars: 6
        prefixes: ["re:", "re：", "fw:", "fw：", "fwd:", "fwd：", "回复:", "回复：", "答复:", "答复：", "转发:", "转发："]
    max_open: 20
    reach:
      cap: 0.5
      conversations: 0.05
      people: 0.05
      sources: 0.1
ingest:
  backoff_initial_ms: 3000
  backoff_max_ms: 60000
  busy_timeout_ms: 5000
  failure_exit_code: 6
  manual_exit_code: 7
  sources:
    - dingtalk:
        account: default
        child_exit_timeout_ms: 5000
        cipher_min_length: 32
        dws:
          decrypt:
            args: [chat, crypto, decrypt, -f, json]
            bin: dws
            sandbox: *dws_sandbox
          env:
            DO_NOT_TRACK: "1"
          listen:
            args: [event, consume, user_im_message_receive_o2o_all, user_im_message_receive_group_all, --flatten, -f, ndjson]
            bin: dws
            sandbox: *dws_sandbox
          lookup:
            args: [chat, +messages-mget, --no-reactions, --no-threads, -f, json]
            bin: dws
            sandbox: *dws_sandbox
          manual_exit_codes: [2, 4]
          parallel: 4
          pull:
            args: [chat, message, list-all, --limit, "100", --page-all, --page-limit, "20", --no-reactions, -f, json]
            bin: dws
            sandbox: *dws_sandbox
          timeout_ms: 120000
          vars:
            HOME: "${HOME}"
            PATH: "${PATH}"
        heal_limit: 50
        initial_backfill_ms: 3600000
        lookup_batch: 50
        notify_conversation_id: "${NOTIFY_CONVERSATION_ID}"
        reconcile_overlap_ms: 300000
        self_sender_id: "${SELF_SENDER_ID}"
        utc_offset_minutes: 480
    - imap:
        account: t4f
        idle_ms: 300000
        initial_backfill_ms: 86400000
        limits: &imap_limits {chars: 4000, depth: 16, fetch_batch: 20, line_bytes: 65536, message_bytes: 262144, parts: 64, search_max: 500}
        mailbox: INBOX
        password: "${IMAP_T4F_PASSWORD}"
        poll_ms: 60000
        proxy: "${IMAP_T4F_PROXY}"
        reconcile_overlap_ms: 3600000
        self_sender_ids: ["${IMAP_T4F_USER}"]
        style: &imap_style
          attachment: "[附件 {type} {name}]"
          quote_ends: ["wrote:", "写道：", "写道:"]
          quote_starts: ["-----Original Message-----", "------------------ 原始邮件 ------------------", "------------------ Original ------------------"]
        timeout_ms: 30000
        url: "${IMAP_T4F_URL}"
        user: "${IMAP_T4F_USER}"
    - imap:
        account: hf
        idle_ms: 300000
        initial_backfill_ms: 86400000
        limits: *imap_limits
        mailbox: INBOX
        password: "${IMAP_HF_PASSWORD}"
        poll_ms: 60000
        proxy: "${IMAP_HF_PROXY}"
        reconcile_overlap_ms: 3600000
        self_sender_ids: ["${IMAP_HF_USER}"]
        style: *imap_style
        timeout_ms: 30000
        url: "${IMAP_HF_URL}"
        user: "${IMAP_HF_USER}"
  store_path: .debug/poly-resolve.db
